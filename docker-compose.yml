# ============================================================
#  EtuSmart — Docker Compose (Développement)
#  Usage : docker compose up -d
# ============================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: etusmart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Exposé uniquement en dev pour accès PgAdmin / DBeaver
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etusmart_internal

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: etusmart_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      # Exposé uniquement en dev (localhost uniquement)
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etusmart_internal

  # ── MinIO (Stockage fichiers PDF) ───────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: etusmart_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      # API S3 (dev uniquement)
      - "127.0.0.1:9000:9000"
      # Console web MinIO (dev uniquement)
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - etusmart_internal

  # ── MinIO Init : création du bucket ─────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: etusmart_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
        mc mb --ignore-existing local/${MINIO_BUCKET_DOCUMENTS};
        mc anonymous set private local/${MINIO_BUCKET_DOCUMENTS};
        echo 'MinIO bucket ready.';
        exit 0;
      "
    networks:
      - etusmart_internal

  # ── Ollama (LLM self-hosted) ─────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: etusmart_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      # Exposé uniquement en interne (le ai-service l'appelle en interne)
      - "127.0.0.1:11434:11434"
    # GPU (décommenter si disponible) :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - etusmart_internal

  # ── Ollama Init : pull du modèle Mistral ────────────────────
  ollama-init:
    image: curlimages/curl:latest
    container_name: etusmart_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo 'Pulling Mistral model...';
        curl -sf -X POST http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d '{\"name\": \"mistral\"}';
        echo 'Model pull initiated.';
      "
    networks:
      - etusmart_internal

  # ── API Gateway ──────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: etusmart_api_gateway
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV:        ${NODE_ENV}
      PORT:            ${API_GATEWAY_PORT}
      POSTGRES_HOST:   postgres
      REDIS_HOST:      redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./backend/api-gateway:/app
      - /app/node_modules
    networks:
      - etusmart_internal

  # ── Frontend React (Vite) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: etusmart_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_URL: http://localhost:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - etusmart_internal

  # ── Nginx (Reverse Proxy) ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: etusmart_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      # En prod : décommenter HTTPS
      # - "443:443"
    depends_on:
      - api-gateway
      - frontend
    networks:
      - etusmart_internal

# ── Volumes persistants ──────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  ollama_data:
    driver: local

# ── Réseau interne isolé ─────────────────────────────────────
networks:
  etusmart_internal:
    driver: bridge
    # Isolation : les conteneurs ne communiquent qu'entre eux
    internal: false   # false = accès internet pour pull images/modèles
