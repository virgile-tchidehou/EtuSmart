# ============================================================
#  EtuSmart — Configuration Nginx (API Gateway reverse-proxy)
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Sécurité : logs sans données sensibles ────────────────
    log_format secure '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log secure;
    error_log  /var/log/nginx/error.log warn;

    # ── Headers sécurité par défaut ──────────────────────────
    add_header X-Content-Type-Options   "nosniff"        always;
    add_header X-Frame-Options          "DENY"           always;
    add_header Referrer-Policy          "strict-origin"  always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # ── Limite taille upload (PDF 50 Mo max) ─────────────────
    client_max_body_size 52M;

    # ── Upstream : API Gateway Node.js ───────────────────────
    upstream api_gateway {
        server api-gateway:4000;
    }

    # ── Upstream : Frontend Vite (dev) ───────────────────────
    upstream frontend {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name localhost;

        # ── Redirection HTTP → HTTPS (production) ────────────
        # En dev, on laisse HTTP ; en prod, décommenter :
        # return 301 https://$host$request_uri;

        # ── API : proxy vers Node.js ──────────────────────────
        location /api/ {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # SSE (streaming IA) : pas de buffering
            proxy_buffering    off;
            proxy_read_timeout 600s;
        }

        # ── Frontend ──────────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
