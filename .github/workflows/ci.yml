name: EtuSmart CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ── Lint & Test Backend ─────────────────────────────────────
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       etusmart_test
          POSTGRES_USER:     test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/api-gateway/package-lock.json

      - name: 📦 Install dependencies
        working-directory: backend/api-gateway
        run: npm ci

      - name: 🧪 Run tests
        working-directory: backend/api-gateway
        env:
          NODE_ENV:        test
          PORT:            4000
          # Secrets de test (JAMAIS de vraies valeurs ici)
          JWT_SECRET:      ${{ secrets.TEST_JWT_SECRET }}
          POSTGRES_HOST:   127.0.0.1
          POSTGRES_PORT:   5432
          POSTGRES_DB:     etusmart_test
          POSTGRES_USER:   test_user
          POSTGRES_PASSWORD: test_password
          REDIS_HOST:      127.0.0.1
          REDIS_PORT:      6379
          REDIS_PASSWORD:  ''
        run: npm test

  # ── Lint Frontend ───────────────────────────────────────────
  lint-frontend:
    name: 🎨 Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔍 Lint
        working-directory: frontend
        run: npm run lint

  # ── Build Docker (uniquement sur main) ─────────────────────
  build-docker:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: [test-backend, lint-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@v4

      - name: 🐳 Build API Gateway image
        run: docker build -t etusmart-api-gateway ./backend/api-gateway

      - name: 🐳 Build Frontend image
        run: docker build -t etusmart-frontend ./frontend

